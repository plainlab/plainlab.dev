<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlainLab — Plain software for practical people</title>
    <meta name="description"
        content="PlainLab is a software agency building practical tools for practical people. Builders of Mergram and Loquira.">
    <link rel="icon" type="image/svg+xml" href="plainlab.svg">

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-primary: #0A0A0A;
            --color-accent: #14B8A6;
            --color-bg: #F5F5F0;
            --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-primary);
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            width: 100%;
        }

        /* --- Header & Logo --- */
        header {
            padding: 4rem 0 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: fadeInDown 1s ease-out;
        }

        .brand-logo {
            width: 120px;
            height: 120px;
            margin-bottom: 1.5rem;
            transition: var(--transition-smooth);
            filter: drop-shadow(0 10px 20px rgba(10, 10, 10, 0.05));
        }

        .brand-logo:hover {
            transform: scale(1.05) rotate(2deg);
        }

        .brand-name {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -0.04em;
            margin-bottom: 0.5rem;
            color: var(--color-primary);
        }

        .brand-name span {
            color: var(--color-accent);
        }

        .tagline {
            font-size: 1.25rem;
            font-weight: 400;
            color: #666;
            max-width: 600px;
            margin: 0 auto;
        }

        /* --- Products Section --- */
        .products {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4rem;
            padding: 4rem 0;
            animation: fadeInUp 1s ease-out 0.2s both;
        }

        .product-card {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: var(--transition-smooth);
            position: relative;
        }

        .product-logo-wrapper {
            background: white;
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            transition: var(--transition-smooth);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 200px;
            height: 200px;
        }

        .product-logo {
            width: 100%;
            height: auto;
            max-width: 140px;
            transition: var(--transition-smooth);
        }

        .product-card:hover {
            transform: translateY(-12px);
        }

        .product-card:hover .product-logo-wrapper {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border: 2px solid var(--color-accent);
        }

        .product-card:hover .product-logo {
            transform: scale(1.1);
        }

        .product-name {
            margin-top: 1.5rem;
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--color-primary);
            opacity: 0;
            transform: translateY(10px);
            transition: var(--transition-smooth);
        }

        .product-card:hover .product-name {
            opacity: 1;
            transform: translateY(0);
        }

        /* --- Footer --- */
        footer {
            padding: 4rem 0;
            text-align: center;
            animation: fadeIn 1s ease-out 0.6s both;
        }

        .contact-link {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--color-primary);
            font-weight: 600;
            font-size: 1rem;
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            border: 1px solid rgba(10, 10, 10, 0.1);
            transition: var(--transition-smooth);
        }

        .contact-link:hover {
            background-color: var(--color-primary);
            color: white;
            border-color: var(--color-primary);
        }

        .email-icon {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* --- Animations --- */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .products {
                flex-direction: column;
                gap: 2rem;
            }

            .brand-name {
                font-size: 2.25rem;
            }

            header {
                padding-top: 2rem;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <img src="plainlab.svg" alt="PlainLab Logo" class="brand-logo">
            <h1 class="brand-name">Plain<span>Lab</span></h1>
            <p class="tagline">Plain software for practical people</p>
        </header>

        <main class="products">
            <a href="https://mergram.com" target="_blank" rel="noopener" class="product-card"
                title="PDF mail merge, made simple">
                <div class="product-logo-wrapper">
                    <img src="mergram.svg" alt="Mergram — PDF Mail Merge" class="product-logo">
                </div>
                <span class="product-name">Mergram</span>
            </a>

            <a href="https://loquira.com" target="_blank" rel="noopener" class="product-card"
                title="Your voice in every language">
                <div class="product-logo-wrapper">
                    <img src="loquira.svg" alt="Loquira — Live Speech Translation" class="product-logo">
                </div>
                <span class="product-name">Loquira</span>
            </a>
        </main>

        <footer>
            <a href="mailto:support@plainlab.dev" class="contact-link">
                <svg class="email-icon" viewBox="0 0 24 24">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
            </a>
        </footer>
    </div>

</body>

</html>
